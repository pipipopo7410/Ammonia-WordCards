<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b726d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="排氨複習">
  <meta name="description" content="國中生物：排氨、尿素與泌尿概念圖練習，可安裝與離線使用。">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>排氨與泌尿｜概念圖練習 2.0.2</title>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="branding">
      <img class="brand-icon" src="./icons/icon-192.png" alt="" width="42" height="42">
      <div><h1>排氨與泌尿：概念圖練習</h1><span class="subline">生物互動教學系統 <strong>2.0.2 測試版</strong></span></div>
    </div>
    <div class="toolbar" aria-label="活動操作">
      <button class="btn primary" id="check-btn" type="button">檢查架構</button>
      <button class="btn" id="snap-btn" aria-pressed="false" type="button" title="開啟時立即整理現有器官字卡；之後移動字卡時自動貼齊格線">貼齊格線：關</button>
      <button class="btn" id="return-btn" type="button" disabled>收回器官</button>
      <button class="btn" id="reset-btn" type="button">重設</button>
      <button class="btn guide" id="install-btn" type="button">安裝說明</button>
    </div>
  </header>
  <div class="notice" role="status" aria-live="polite">
    <span id="status-text">將器官字卡拖到畫布，依序點兩張器官建立有方向的連線，再放上物質。</span>
    <span id="network-status" class="network-indicator" aria-label="連線狀態">偵測中</span>
  </div>
  <main class="workspace">
    <aside class="sidebar" aria-label="字卡來源">
      <section class="pool-section">
        <h2>器官卡 <small>各放一次</small></h2>
        <div id="organ-pool" class="organ-pool" aria-label="器官字卡"></div>
      </section>
      <section class="pool-section">
        <h2>物質卡 <small>可重複使用</small></h2>
        <div id="matter-pool" class="matter-pool" aria-label="物質字卡"></div>
      </section>
    </aside>
    <section class="canvas-area" aria-label="自由排列的概念圖">
      <div id="canvas" tabindex="0" aria-label="概念圖畫布；選取字卡後點此放置">
        <svg id="svg-layer" aria-hidden="true"></svg>
        <div id="line-slots" aria-label="各連線的物質標籤"></div>
        <p id="canvas-empty" class="canvas-empty">先把器官放上畫布，再建立物質運輸路徑</p>
        <div id="canvas-counter" class="canvas-counter">器官 0／7 · 必要路徑 0／7</div>
      </div>
    </section>
  </main>
  <div id="dialog" class="modal-backdrop" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <div class="modal">
      <h2 id="dialog-title">活動提示</h2>
      <div id="dialog-content"></div>
      <button type="button" id="dialog-close" class="btn primary">知道了</button>
    </div>
  </div>
</body>
</html>
